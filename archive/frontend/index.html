<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signomat Archive</title>
    <meta
      name="description"
      content="Public archive for Signomat roadside sign detections, trip traces, and review workflows."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar panel">
        <div class="brand-row">
          <div class="brand-copy">
            <p class="eyebrow">Sign Archive</p>
            <h1>Signomat</h1>
            <p class="muted">Public roadside archive, trip maps, and review tools on one Cloudflare host.</p>
          </div>
          <nav class="nav">
            <a data-nav data-route="archive" href="/">Archive</a>
            <a data-nav data-route="review" href="/review">Review</a>
            <a data-nav data-route="training" href="/training">Training</a>
          </nav>
        </div>

        <details class="settings-panel">
          <summary>
            <strong>Connection Settings</strong>
            <span class="muted">API base and admin token</span>
          </summary>
          <div class="settings-body">
            <form id="settings-form" class="settings-form">
              <label class="field-group">
                <span>API base</span>
                <input id="api-base" class="field" name="apiBase" type="url" placeholder="https://signs.jamesburgat.com" />
              </label>
              <label class="field-group">
                <span>Admin token</span>
                <input id="admin-token" class="field" name="adminToken" type="password" placeholder="Only needed for review and training" />
              </label>
              <button class="button primary" type="submit">Apply</button>
            </form>
            <div id="config-status" class="status-line">Checking archive configuration...</div>
            <div id="config-hint" class="status-line">Public archive works without a token.</div>
          </div>
        </details>
      </header>

      <main id="app" class="app-shell">
        <section class="panel loading-panel">
          <p class="eyebrow">Archive</p>
          <h2>Loading archive data...</h2>
        </section>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
